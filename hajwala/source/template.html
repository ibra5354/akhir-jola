<script>
(function(){
  function show(msg){ var l=document.querySelector('#loading .lt'); if(l){ l.textContent='صار خطأ: '+msg; l.style.color='#ff9a7a'; } }
  window.__bootErr = show;
  window.addEventListener('error', function(e){ if(!window.__H || !window.__H.ready) show((e && e.message) || 'غير معروف'); });
  window.addEventListener('unhandledrejection', function(e){ if(!window.__H || !window.__H.ready) show(String(e && e.reason && (e.reason.message || e.reason))); });
  setTimeout(function(){ if(!window.__H || !window.__H.ready){ var l=document.querySelector('#loading .lt'); if(l && l.textContent.indexOf('خطأ')<0) l.textContent += ' (يطوّل شوي… لو ما تحرّك سكّر الصفحة وافتحها مرة ثانية)'; } }, 20000);
})();
</script>
